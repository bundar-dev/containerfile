name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - uses: dominikh/staticcheck-action@v1
        with:
          install-go: false
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage threshold (95%)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "coverage: $total%"
          awk -v t="$total" 'BEGIN { exit (t < 95) }'

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          tags: containerfile:ci
      - name: Smoke test
        run: |
          mkdir -p /tmp/app && echo '<h1>hi</h1>' > /tmp/app/index.html
          docker run --rm --network=none --user "$(id -u):$(id -g)" \
            -v /tmp/app:/workspace -w /workspace containerfile:ci
          grep -q nginx /tmp/app/Dockerfile
